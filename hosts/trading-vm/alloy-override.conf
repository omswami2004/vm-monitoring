# /etc/systemd/system/alloy.service.d/override.conf on the trading VM.
# The 50ms trading loop always wins: lowest CPU/IO priority and Go GC tuned to a small heap.
# No MemoryHigh and no swap: a soft cap made the kernel evict Alloy's pages into swap and
# re-read its binary from disk in a loop (~50 MB/s reads, load 2.5). If Alloy goes over
# MemoryMax, only Alloy is OOM-killed, and systemd restarts it.
[Service]
MemoryMax=300M
MemorySwapMax=0
Environment=GOMEMLIMIT=110MiB
Environment=GOGC=50
CPUWeight=10
IOWeight=10
Nice=15
Restart=on-failure
RestartSec=30
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/var/lib/alloy
