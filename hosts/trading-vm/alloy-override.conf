# /etc/systemd/system/alloy.service.d/override.conf on the trading VM.
# The 50ms trading loop always wins: lowest CPU/IO priority, hard memory cap, Go GC tuned to it.
[Service]
MemoryMax=160M
MemoryHigh=128M
Environment=GOMEMLIMIT=110MiB
Environment=GOGC=50
CPUWeight=10
IOWeight=10
Nice=15
Restart=on-failure
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/var/lib/alloy
