# Prometheus config for ampere-m1. Deployed to /etc/prometheus/prometheus.yml.
global:
  # 60s = 1 sample/min per series, the rate Grafana Cloud's series quota assumes.
  scrape_interval: 60s
  evaluation_interval: 60s
  external_labels:
    instance_host: ampere-m1

# Ship to Grafana Cloud (hosted Prometheus). Credentials: user = stack metrics ID,
# password_file = /etc/prometheus/grafana-cloud.token (prometheus:prometheus 600, not in git).
# The drops below keep the series count well under the free tier's 10k.
remote_write:
  - url: https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push
    basic_auth:
      username: "3680297"
      password_file: /etc/prometheus/grafana-cloud.token
    write_relabel_configs:
      # Monitoring-stack internals: keep only `up`.
      - source_labels: [job, __name__]
        regex: "(prometheus|alertmanager|wa-relay|blackbox);(?:[^u].*|u[^p].*|up.+)"
        action: drop
      # Exporters' own Go runtime / HTTP handler stats.
      - source_labels: [__name__]
        regex: "(go_|promhttp_|process_).*"
        action: drop
      # systemd: only whether each unit is active or failed.
      - source_labels: [__name__, state]
        regex: "node_systemd_unit_state;(activating|deactivating|inactive)"
        action: drop
      # Per-thread process stats and rarely-used node collectors.
      - source_labels: [__name__]
        regex: "namedprocess_namegroup_thread_.*|node_(scrape_collector_.*|cpu_guest_seconds_total|softnet_.*|arp_entries|nfs_.*|udp_queues|cooling_device_.*|power_supply_.*|thermal_zone_temp)"
        action: drop
      # Grafana Cloud's Linux integration dashboards expect these labels for node_exporter data.
      - source_labels: [job]
        regex: node
        target_label: instance
        replacement: ampere-m1
      - source_labels: [job]
        regex: node
        target_label: job
        replacement: integrations/node_exporter

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:9090"] }]

  - job_name: alertmanager
    static_configs: [{ targets: ["127.0.0.1:9093"] }]

  - job_name: node
    static_configs: [{ targets: ["127.0.0.1:9100"] }]

  - job_name: process
    static_configs: [{ targets: ["127.0.0.1:9256"] }]

  - job_name: nginx
    static_configs: [{ targets: ["127.0.0.1:9113"] }]

  - job_name: nginxlog
    static_configs: [{ targets: ["127.0.0.1:4040"] }]

  - job_name: blackbox
    static_configs: [{ targets: ["127.0.0.1:9115"] }]

  - job_name: wa-relay
    static_configs: [{ targets: ["127.0.0.1:9097"] }]

  # Public sites as users see them (through Cloudflare where proxied).
  # 2xx/3xx/401 = up (redirects to login and basic-auth prompts count as up).
  - job_name: blackbox-public
    scrape_interval: 60s
    metrics_path: /probe
    params: { module: [http_public] }
    static_configs:
      - targets:
          - https://sattle.axiosiiitl.dev/
          - https://battle.axiosiiitl.dev/health
          - https://g1.axiosiiitl.dev/
          - https://g2.axiosiiitl.dev/
          - https://cdn.axiosiiitl.dev/
          - https://index.axiosiiitl.dev/
          - https://fetch.axiosiiitl.dev/
          - https://auth.axiosiiitl.dev/
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Backends directly on loopback (tells "app down" apart from "nginx/Cloudflare down").
  - job_name: blackbox-local
    scrape_interval: 60s
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["http://127.0.0.1:3100/health"]
        labels: { service: sattle }
      - targets: ["http://127.0.0.1:8787/health"]
        labels: { service: jarvis-bridge }
      - targets: ["http://127.0.0.1:8090/healthz"]
        labels: { service: private-cdn }
      - targets: ["http://127.0.0.1:8000/api/server"]
        labels: { service: screen-streamer }
    relabel_configs: *blackbox_relabel

  - job_name: blackbox-tcp
    scrape_interval: 60s
    metrics_path: /probe
    params: { module: [tcp_connect] }
    static_configs:
      - targets: ["127.0.0.1:3000"]
        labels: { service: screen-streamer-rtmp }
    relabel_configs: *blackbox_relabel

  # App-level metrics: enable once the PRs are merged and deployed with METRICS_ADDR set
  # (sattle: gandhiyaash/sattle#78, private-cdn: MrImmortal09/private-cdn#2).
  # Uncomment in /etc/prometheus/prometheus.yml, then `sudo systemctl reload prometheus`.
  # - job_name: sattle
  #   static_configs: [{ targets: ["127.0.0.1:9464"] }]
  # - job_name: private-cdn
  #   static_configs: [{ targets: ["127.0.0.1:9466"] }]
