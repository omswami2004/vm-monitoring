# Added for Prometheus monitoring (vm-monitoring repo). Lives in conf.d (http context).
# 1) An extra access log with $host so prometheus-nginxlog-exporter can split metrics per site.
#    The existing /var/log/nginx/access.log keeps its format; this is an additional log.
log_format monitoring '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" host=$host rt=$request_time';
access_log /var/log/nginx/monitoring.log monitoring;

# 2) stub_status for nginx-prometheus-exporter, loopback only.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
    location / { return 404; }
}
