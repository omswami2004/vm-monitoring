modules:
  http_public:
    prober: http
    timeout: 15s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 201, 204, 301, 302, 303, 307, 308, 401]
      fail_if_not_ssl: true
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
  tcp_connect:
    prober: tcp
    timeout: 5s
