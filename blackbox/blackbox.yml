modules:
  http_public:
    prober: http
    timeout: 15s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 201, 204, 301, 302, 303, 307, 308, 401]
      fail_if_not_ssl: true
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
  tcp_connect:
    prober: tcp
    timeout: 5s
  # Alert intake must answer 401 to an unauthenticated POST (nginx up, wa-relay up, token enforced).
  http_post_401:
    prober: http
    timeout: 10s
    http:
      method: POST
      preferred_ip_protocol: ip4
      valid_status_codes: [401]
      body: "{}"
  # ampere m2 directly (see the blackbox-origin job). The URL's host is "ampere-m2", so the
  # real site name goes in the Host header and TLS SNI, and the certificate is checked against it.
  http_origin_cdn:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 301, 302]
      fail_if_not_ssl: true
      headers: { Host: cdn.axiosiiitl.dev }
      tls_config: { server_name: cdn.axiosiiitl.dev }
